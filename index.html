<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luvely Blooms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <!--Background video plays silently and repeats -->
    <video class="hero-video" autoplay muted loop playsinline
        poster="poster.jpg">
      <source src="background-video.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>

    <!--Dark Layer helps the text stand out -->
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Beautiful Blooms for Every Moment</h1>
      <p>Thoughtfully arranged bouquets to celebrate life and the people you love.
</p>
    </div>
  </section>
</body>
</html>
